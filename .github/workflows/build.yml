name: Build SAUCE VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target SAUCE_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SAUCE-vst3
          path: build/SAUCE_artefacts/Release/VST3/SAUCE.vst3
